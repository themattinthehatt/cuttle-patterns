name: Run CPU tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install beast-backbones
        env:
          # beast's gsplat fork otherwise unconditionally builds a CUDAExtension, which
          # fails at metadata-prep time on a runner with no CUDA_HOME at all.
          BUILD_NO_CUDA: "1"
        run: |
          # CPU wheels first so lightning/beast/cuttle-patterns' own torch(vision) pulls
          # are satisfied by these instead of pulling the much heavier CUDA build on this
          # CPU-only runner. torch and torchvision must come from the same index/build --
          # an unconstrained `pip install torchvision` later would resolve a PyPI default
          # build with a mismatched ABI against this CPU wheel, breaking custom op
          # registration (torchvision::nms) at import time.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install lightning poetry-core
          pip install git+https://github.com/paninski-lab/beast.git --no-build-isolation

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run CPU tests
        run: pytest -m "not gpu"
